<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Example — ScrapeKit Fixture</title>
    <meta name="description" content="A small example page used by ScrapeKit tests." />
    <link rel="canonical" href="http://example.com/" />
  </head>
  <body>
    <h1>Welcome to the Example Page</h1>
    <h2>Section One</h2>
    <p>This is the first paragraph. It contains a <a href="/about">link to about</a>.</p>
    <h2>Section Two</h2>
    <p>Another paragraph with an <a href="http://example.com/about">absolute link</a>.</p>
    <ul>
      <li><a href="/about#team">Team</a></li>
      <li><a href="https://other.com/external">External</a></li>
      <li><a href="javascript:void(0)">JS link</a></li>
      <li><a href="#top">Anchor</a></li>
    </ul>
    <article>
      <h1>Article Title</h1>
      <p>Article body.</p>
      <a href="/contact/">Contact</a>
    </article>
  </body>
</html>
